name: Test

on:
  workflow_call:
    inputs:
      python-version:
        type: string
        required: false
        default: "3.10"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ inputs.python-version }}
          enable-cache: true
      - name: Install project
        run: uv sync --locked
      - name: Test
        run: uv run pytest
