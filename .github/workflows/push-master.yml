name: Push to master flow - release, build and publish

on:
  push:
    branches:
      - master

env:
  python-version: "3.10"

jobs:
  test:
    uses: ./.github/workflows/test.yml

  release:
    needs: test
    runs-on: ubuntu-latest
    environment: release
    outputs:
      # The commit to build and publish: the version bump commit, or the pushed one when there is no release.
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ env.python-version }}
      - name: Create release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "action@github.com"
          uv run --only-group release semantic-release version
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: release
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.release.outputs.sha }}

  publish:
    needs: [release, build]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      # IMPORTANT: this permission is mandatory for trusted publishing
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.release.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Put the release commit on the master branch
        # semantic-release refuses to run on the detached HEAD left by checking out a SHA.
        run: git switch -C "$GITHUB_REF_NAME"
      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ env.python-version }}
      - name: Upload artifacts to the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "action@github.com"
          uv run --only-group release semantic-release publish
      - name: Publish package distributions to PyPI
        # Trusted publishing; --check-url skips files already on PyPI (a push without a new version).
        run: uv publish --trusted-publishing always --check-url https://pypi.org/simple/
