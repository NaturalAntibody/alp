[project]
name = "alp"
version = "0.1.0"
description = "Gumbel (Karlin-Altschul) parameters for local alignment scores via the NCBI ALP library"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[build-system]
requires = ["poetry-core>=2.0.0", "cmake>=3.14"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "alp" }]
include = [
    { path = "alp/libalp.so", format = "wheel" },
    { path = "CMakeLists.txt", format = "sdist" },
    { path = "src/**/*", format = "sdist" },
    { path = "lib/**/*", format = "sdist" },
]
exclude = ["alp/libalp.so"]

[tool.poetry.build]
script = "scripts/build_ext.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
