[build-system]
requires = ["scikit-build-core>=0.11"]
build-backend = "scikit_build_core.build"

[project]
name = "alp-na"
version = "1.0.0"
description = "Gumbel (Karlin-Altschul) parameters for local alignment scores via the NCBI ALP library"
readme = "README.md"
authors = [{ name = "NaturalAntibody" }]
requires-python = ">=3.9"
dependencies = []

[project.urls]
Homepage = "https://github.com/NaturalAntibody/alp"

[dependency-groups]
dev = ["pytest>=8", "numpy"]
release = ["python-semantic-release~=10.0"]

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.version = ">=3.15"
wheel.packages = ["alp"]
# libalp is loaded with ctypes and does not use the Python C API, so a single
# wheel per platform serves every Python version (py3-none-<platform>).
wheel.py-api = "py3"
# A persistent build dir makes `uv sync` rebuilds incremental.
build-dir = "build/{wheel_tag}"
sdist.exclude = [".github/", "scripts/"]

[tool.uv]
# Reinstall (and so rebuild) the editable project when the C++ sources change.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "CMakeLists.txt" },
    { file = "src/**/*.cpp" },
    { file = "src/**/*.h" },
    { file = "lib/**/*.cpp" },
    { file = "lib/**/*.hpp" },
]

[tool.cibuildwheel]
# The wheel is py3-none-<platform>, so building it once per platform (via cp310)
# covers every Python version.
build = ["cp310-*"]
skip = ["*-musllinux_*", "*-win32"]
build-frontend = "build[uv]"
test-requires = ["pytest>=7"]
test-sources = ["tests"]
test-command = "pytest tests"

[tool.cibuildwheel.macos]
archs = ["universal2"]

[tool.cibuildwheel.windows]
archs = ["AMD64"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.semantic_release]
# uv.lock records the project version, so refresh it in the release commit.
# The real build happens later in CI (cibuildwheel + uv build --sdist).
build_command = "uv lock --upgrade-package alp-na && git add uv.lock"
commit_message = "bump: {version} [skip ci]\n\nAutomatically generated by python-semantic-release"
tag_format = "v{version}"
version_toml = ["pyproject.toml:project.version"]
version_variables = ["alp/__init__.py:__version__"]

[tool.semantic_release.remote]
type = "github"

[tool.semantic_release.commit_parser_options]
allowed_tags = [
    "build",
    "chore",
    "ci",
    "docs",
    "feat",
    "fix",
    "perf",
    "style",
    "refactor",
    "test",
]
minor_tags = ["feat"]
patch_tags = ["fix", "perf", "docs", "build"]
